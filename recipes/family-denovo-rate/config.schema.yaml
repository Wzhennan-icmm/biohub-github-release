$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - pairs_manifest
  - included_tiers
  - included_evidence_classes
  - ploidy
  - confidence_level
  - require_all_candidates_callable
properties:
  pairs_manifest: {type: string, minLength: 1}
  included_tiers:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, minLength: 1}
  included_evidence_classes:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, enum: [candidate, experimentally_confirmed]}
  ploidy: {type: integer, minimum: 1}
  confidence_level: {type: number, exclusiveMinimum: 0, exclusiveMaximum: 1}
  require_all_candidates_callable: {type: boolean}
