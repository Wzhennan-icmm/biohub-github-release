$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - feature_table
  - metadata_tsv
  - constraints
  - condition_covariates
  - transform
  - minimum_prevalence
  - minimum_total_abundance
  - drop_incomplete_samples
  - permutations
  - random_seed
  - scaling
properties:
  feature_table: {type: string, minLength: 1}
  metadata_tsv: {type: string, minLength: 1}
  constraints:
    type: array
    minItems: 1
    uniqueItems: true
    items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.]*$'}
  condition_covariates:
    type: array
    uniqueItems: true
    items: {type: string, pattern: '^[A-Za-z][A-Za-z0-9_.]*$'}
  transform: {type: string, enum: [hellinger, relative, log1p, none]}
  minimum_prevalence: {type: number, minimum: 0, maximum: 1}
  minimum_total_abundance: {type: number, minimum: 0}
  drop_incomplete_samples: {type: boolean}
  permutations: {type: integer, minimum: 1}
  random_seed: {type: integer, minimum: 0}
  scaling: {type: integer, enum: [1, 2]}
