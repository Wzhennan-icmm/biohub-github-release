$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
additionalProperties: false
required:
  - runs_manifest
  - mcmctree_executable
  - expected_loci
  - expected_internal_nodes
  - age_column_regex
  - burnin_samples
  - minimum_ess
properties:
  runs_manifest: {type: string, minLength: 1}
  mcmctree_executable: {type: string, minLength: 1}
  expected_loci: {type: integer, minimum: 1}
  expected_internal_nodes: {type: integer, minimum: 1}
  age_column_regex: {type: string, minLength: 1}
  burnin_samples: {type: integer, minimum: 0}
  minimum_ess: {type: number, exclusiveMinimum: 0}
