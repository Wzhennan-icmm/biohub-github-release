name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
        working-directory: biohub-rs
      - run: cargo clippy --locked -- -D warnings
        working-directory: biohub-rs
      - run: cargo test --locked
        working-directory: biohub-rs
      - run: cargo run --locked -- catalog --format json > /tmp/catalog.json
        working-directory: biohub-rs

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build --tag biohub:test .
      - run: docker run --rm biohub:test catalog --format json
      - run: docker run --rm biohub:test doctor --json
      - run: >-
          docker run --rm biohub:test run dotplot
          --input /usr/local/share/biohub/examples/dotplot/input.paf
          --output /tmp/dotplot.pdf --format paf
