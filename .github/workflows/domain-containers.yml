name: Domain containers

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag or release ref
        required: true
        type: string
      publish:
        description: Push immutable images to GHCR
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag for preflight build
        required: true
        default: dev
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: comparative
            recipes: comparative-orthology-codon,gene-family-cafe,selection-branch-site,dating-mcmctree,synteny-sv
          - environment: assembly
            recipes: assembly-t2t-evaluate
          - environment: population
            recipes: population-gwas,population-selection
          - environment: variant
            recipes: family-denovo-rate
          - environment: omics
            recipes: rnaseq-deseq2,functional-enrichment,microbiome-rda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Select image tag
        shell: bash
        env:
          RAW_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          raw_tag="${RAW_IMAGE_TAG}"
          image_tag="${raw_tag#v}"
          [[ "${image_tag}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$ ]]
          echo "BIOHUB_IMAGE_TAG=$image_tag" >> "$GITHUB_ENV"
      - name: Build
        run: >-
          docker build -f containers/Dockerfile.domain
          --build-arg ENVIRONMENT=${{ matrix.environment }}
          --tag "ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}" .
      - name: Smoke test
        run: |
          image="ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}"
          docker run --rm "$image" --version
          docker run --rm "$image" recipe list --format json
          IFS=',' read -ra recipes <<< "${{ matrix.recipes }}"
          for recipe in "${recipes[@]}"; do
            docker run --rm "$image" doctor --recipe "$recipe" --strict
          done
      - name: Export exact environment
        shell: bash
        run: |
          image="ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}"
          mkdir -p domain-metadata
          docker run --rm --entrypoint micromamba "$image" list --name base --explicit \
            > "domain-metadata/biohub-${{ matrix.environment }}-${BIOHUB_IMAGE_TAG}.explicit.txt"
          docker image inspect --format '{{.Id}}' "$image" \
            > "domain-metadata/biohub-${{ matrix.environment }}-${BIOHUB_IMAGE_TAG}.local-image-id.txt"
      - name: Execute low-risk synthetic workflows
        if: matrix.environment == 'variant' || matrix.environment == 'omics'
        shell: bash
        run: |
          image="ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}"
          recipe_args=()
          if [[ "${{ matrix.environment }}" == "variant" ]]; then
            recipe_args+=(--recipe family-denovo-rate)
          else
            recipe_args+=(--recipe rnaseq-deseq2)
            recipe_args+=(--recipe functional-enrichment)
            recipe_args+=(--recipe microbiome-rda)
          fi
          docker run --rm -v "$PWD:/repo:ro" --entrypoint python "$image" \
            /repo/tools/snakemake_smoke.py --root /repo --snakemake snakemake \
            --biohub biohub --execute-safe "${recipe_args[@]}"
      - name: Build public domain-review evidence
        if: matrix.environment == 'comparative' || matrix.environment == 'omics'
        shell: bash
        run: |
          mkdir -p validation-evidence
          chmod 0777 validation-evidence
          if [[ "${{ matrix.environment }}" == "comparative" ]]; then
            pack=orthology-codon
          else
            pack=statistics
          fi
          image="ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}"
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$PWD/validation-evidence:/evidence" \
            --entrypoint python "$image" \
            /repo/tools/validation_review.py --root /repo build \
            --commit "${GITHUB_SHA}" \
            --pack "$pack" --output /evidence \
            --biohub /usr/local/bin/biohub --snakemake /opt/conda/bin/snakemake
          docker run --rm \
            -v "$PWD:/repo:ro" \
            -v "$PWD/validation-evidence:/evidence:ro" \
            --entrypoint python "$image" \
            /repo/tools/validation_review.py --root /repo verify \
            --pack "$pack" --output /evidence
      - if: inputs.publish
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable release tag
        if: inputs.publish
        run: >-
          docker push "ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}"
      - name: Record published digest
        if: inputs.publish
        shell: bash
        run: |
          image="ghcr.io/wzhennan-icmm/biohub-${{ matrix.environment }}:${BIOHUB_IMAGE_TAG}"
          docker buildx imagetools inspect "$image" \
            | awk '/^Digest:/ {print $2; exit}' \
            > "domain-metadata/biohub-${{ matrix.environment }}-${BIOHUB_IMAGE_TAG}.digest.txt"
          test -s "domain-metadata/biohub-${{ matrix.environment }}-${BIOHUB_IMAGE_TAG}.digest.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: biohub-${{ matrix.environment }}-${{ env.BIOHUB_IMAGE_TAG }}-metadata
          path: |
            domain-metadata/
            validation-evidence/
          include-hidden-files: true
