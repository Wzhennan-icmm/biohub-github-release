name: Bug report
description: Report reproducible BioHub behavior
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: BioHub version
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Exact command
      description: Remove private paths and identifiers.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual stderr/output
    validations:
      required: true
